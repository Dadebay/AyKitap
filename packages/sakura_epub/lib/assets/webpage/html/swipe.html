<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPUB</title>
    <!-- <script src="http://code.jquery.com/jquery-2.1.4.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/detect_swipe/2.1.1/jquery.detect_swipe.min.js"></script> -->
    <script src="../dist/jszip.min.js"></script>
    <script src="../dist/epub.js"></script>

    <link rel="stylesheet" type="text/css" href="examples.css" />

    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* The page-change animations translate #viewer past the edges; without
           this the browser would grow a scrollbar and let it be dragged. */
        overflow: hidden;
      }

      #viewer {
        width: 100%;
        height: 100%;
        /* No margin: the rendition is sized to the full viewport (100vw/100vh),
           so any margin here pushes that much of the page out under body's
           overflow:hidden and clips the last line. Page margins are set by
           insetting the WebView on the Flutter side instead. */
        margin: 0;
        background: white;
      }

      @media only screen and (min-device-width: 320px) and (max-device-width: 667px) {
        .arrow {
          position: inherit;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script src="epubView.js"></script>
  </body>
</html>
