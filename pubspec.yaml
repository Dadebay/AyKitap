name: aykitap
description: "Aykitap - E-book reading application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #==================== STATE MANAGEMENT ====================#
  provider: ^6.1.2

  #==================== NETWORK ====================#
  dio: ^5.3.3
  http: ^1.2.2

  #==================== UI & UX ====================#
  flutter_svg: ^2.0.12
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.3.0
  hugeicons: ^1.1.7
  smooth_page_indicator: ^1.2.1

  #==================== LOCAL STORAGE ====================#
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  #==================== UTILITIES ====================#
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  archive: ^4.0.9
  crypto: ^3.0.7
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0

  #==================== EPUB READER ====================#
  flutter_epub_viewer:
    path: ./packages/flutter_epub_viewer

  #==================== PDF READER ====================#
  flutter_pdfview: ^1.3.4

  #==================== FILE PICKING ====================#
  file_picker: ^9.2.3

  #==================== WEBVIEW (needed by epub stub) ====================#
  webview_flutter: ^4.5.0
  carousel_slider: ^5.1.2

  #==================== ANALYTICS ====================#
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5

  #==================== PUSH NOTIFICATIONS ====================#
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/books/
    - assets/fonts/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/covers/
    - assets/images/banners/
    - assets/icons/
    - assets/animations/
    - assets/flags/

  fonts:
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf
    - family: NewYork
      fonts:
        - asset: assets/fonts/NewYork.ttf
