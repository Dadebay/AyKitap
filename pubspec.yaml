name: aykitap
description: "Aykitap - E-book reading application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #==================== STATE MANAGEMENT ====================#
  provider: ^6.1.2

  #==================== NETWORK ====================#
  dio: ^5.3.3
  http: ^1.2.2

  #==================== UI & UX ====================#
  flutter_svg: ^2.0.12
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  lottie: ^3.3.0
  hugeicons: ^1.1.7
  iconly: ^1.0.1
  smooth_page_indicator: ^1.2.1

  #==================== LOCAL STORAGE ====================#
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  #==================== UTILITIES ====================#
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  archive: ^4.0.9
  crypto: ^3.0.7
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0

  #==================== EPUB READER ====================#
  # sakura_epub — full-featured epub.js + flutter_inappwebview reader
  # (annotations, search, themes, navigation). Vendored under packages/.
  sakura_epub:
    path: ./packages/sakura_epub

  #==================== PDF READER ====================#
  # flutter_pdfview — vendored from pub 1.4.4 under packages/ for two fixes
  # upstream doesn't allow from Dart (see that copy's own comments):
  #   * `fitEachPage` is declared but never forwarded to Android, pinning it
  #     to AndroidPdfViewer's default of false — which renders a book with
  #     mixed page sizes at the *largest* page's scale, so its normal pages
  #     come out shrunken with bands down either side.
  #   * no way to close the inter-page gap on iOS: `autoSpacing` is the gap
  #     control on Android but is wired to PDFKit's `autoScales` on iOS, so
  #     `pageSpacing` was added to reach `pageBreakMargins`.
  flutter_pdfview:
    path: ./packages/flutter_pdfview
  # pdfrx — PDFium-backed text extraction, used to detect real text-layer
  # PDFs and pull their text for the EPUB-style reflow reader.
  pdfrx: ^2.4.7

  #==================== FILE PICKING ====================#
  file_picker: ^9.2.3

  #==================== IMAGE PROCESSING ====================#
  # Pure-Dart JPEG re-encode/resize — used to shrink picked avatar photos
  # below the backend's upload limit without a native codec dependency.
  image: ^4.5.4

  #==================== WEBVIEW (needed by epub stub) ====================#
  webview_flutter: ^4.5.0
  # Direct dependency (not just transitive via webview_flutter) so
  # PaymentWebViewScreen can reach AndroidWebViewController.setUseWideViewPort
  # — the platform-interface controller defaults that to false, unlike plain
  # android.webkit.WebView, which is why bank pages render zoomed-in/desktop-
  # width until this is set explicitly.
  webview_flutter_android: ^4.10.0

  #==================== ANALYTICS ====================#
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5

  #==================== PUSH NOTIFICATIONS ====================#
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.0.0
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/icons/reader/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/banks/
    - assets/icons/
    - assets/animations/
    - assets/flags/

  fonts:
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    # Reader font options (TZ §12.4) — used both for the settings-sheet
    # previews and injected into the epub WebView as @font-face.
    - family: SanFrancisco
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial-Regular.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    # Splash wordmark only ("Aykitap" text) — not a reader font option.
    - family: Congenial
      fonts:
        - asset: assets/fonts/Congenial-Medium.otf
          weight: 500
